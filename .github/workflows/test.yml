name: Tests

# Unit tests (jsdom) on two Node versions, and the browser integration tests (real Chrome) with
# combined coverage. See "Running the tests" in the README for how to do the same locally.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  browser:
    name: Browser tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci

      # The runner image ships with Google Chrome; the tests find it on their own.
      - name: Browser in use
        run: google-chrome --version

      # Unit and browser tests together, so the coverage figure covers both. The job fails if
      # coverage drops below the thresholds in .c8rc.json.
      - name: Run all tests with coverage
        run: npm run coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (n, m) => `| ${n} | ${m.pct}% | ${m.covered} / ${m.total} |`;
              console.log("### Coverage of dag-editor.js (unit + browser tests)\n");
              console.log("| | Covered | Count |\n|---|---|---|");
              for (const k of ["lines", "statements", "functions", "branches"]) console.log(row(k, t[k]));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
